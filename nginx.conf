# SimTrade Nginx 反向代理配置示例
user nginx;
worker_processes auto;
worker_rlimit_nofile 16384;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;
events { worker_connections 8192; multi_accept on; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on; tcp_nopush on;
    keepalive_timeout 20;
    server_tokens off;
    gzip on; gzip_comp_level 5; gzip_min_length 256;
    gzip_types application/json text/css application/javascript text/plain;
    open_file_cache max=200 inactive=10s; open_file_cache_valid 1s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    # Cloudflare edge ranges -> real client IP
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    proxy_cache_path /var/cache/nginx/simmkt levels=1 keys_zone=mkt:4m max_size=40m inactive=2m use_temp_path=off;
    upstream sim { server 127.0.0.1:8300; keepalive 16; }
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name your-domain.com;
        root /var/www/aws;
        index index.html;
        limit_conn perip 40;
        if ($http_x_forwarded_proto = "http") { return 301 https://$host$request_uri; }
        location /.well-known/acme-challenge/ { root /var/www/html; }
        location /data/ { add_header Cache-Control "no-cache"; expires off; }
        location = /index.html { add_header Cache-Control "no-cache"; }
        location /api/auth/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://sim; proxy_http_version 1.1; proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr; proxy_read_timeout 20s;
        }
        location /api/market/ {
            limit_req zone=api burst=40 nodelay;
            limit_req_status 429;
            proxy_pass http://sim; proxy_http_version 1.1; proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr; proxy_read_timeout 15s;
            proxy_cache mkt; proxy_cache_key $request_uri; proxy_cache_lock on; proxy_cache_lock_timeout 6s;
            proxy_cache_use_stale updating error timeout; proxy_cache_background_update on;
            add_header X-Cache $upstream_cache_status;
        }
        location ~ ^/api/v1/market/ {
            rewrite ^/api/v1/market/(.*)$ /api/market/$1 last;
        }
        location ^~ /lib/ { expires 30d; add_header Cache-Control "public, max-age=2592000, immutable"; }
        location ~ \.(js|css)$ { add_header Cache-Control "public, max-age=300"; }
        location = /api.md { default_type "text/markdown; charset=utf-8"; add_header Cache-Control "no-cache"; }
        location = /llms.txt { default_type "text/plain; charset=utf-8"; }
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            limit_req_status 429;
            client_max_body_size 4k;
            proxy_pass http://sim; proxy_http_version 1.1; proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr; proxy_read_timeout 15s;
        }
        location / { try_files $uri $uri/ =404; }
    }
}
